[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sushi-billing-app"
version = "0.1.0"
description = "Stateless sushi plate stack billing via YOLO front-rim detection and HSV colour classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ISY5004 Project Team" }]
keywords = ["computer-vision", "yolo", "billing", "sushi", "gradio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "ultralytics>=8.3.0",
    "numpy>=1.24.0,<2.0",
    "opencv-python-headless>=4.8.0,<4.11",
    "pandas>=2.0.0",
    "gradio>=4.0.0,<6.0",
    "torch>=2.0.0,<2.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
